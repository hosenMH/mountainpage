<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- ترميز الصفحة للغة العربية -->
  <meta charset="UTF-8">
  <!-- ضبط عرض الصفحة على الشاشات -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- عنوان الصفحة -->
  <title>صفحة الجبال</title>
</head>
<body>

  <!-- بداية الهيدر -->
  <header>
    <h1>عالم الجبال</h1>
    <!-- روابط التنقل -->
    <nav>
      <a href="#pic">الصورة</a> |
      <a href="#info">معلومات</a> |
      <a href="#msg">تواصل</a>
    </nav>
  </header>

  <hr>

  <!-- المحتوى الأساسي -->
  <main>

    <!-- قسم الصورة الرئيسية -->
    <section id="pic">
      <h2>مشهد جبال ثلجية</h2>
      <p>صورة بالأبيض والأسود لسلسلة جبال مغطاة بالثلوج.</p>
      <!-- صورة الجبال -->
      <img src="IMG_7458.jpeg" alt="جبال ثلجية أبيض وأسود" width="650">
    </section>

    <hr>

    <!-- قسم المعلومات -->
    <section id="info">
      <h2>عن المشهد</h2>
      <p>تظهر في الصورة قمم الجبال الثلجية والسماء الغائمة والأشجار في الأسفل.</p>
    </section>

    <hr>

    <!-- قسم التواصل -->
    <section id="msg">
      <h2>راسلنا</h2>
      <!-- نموذج تواصل بسيط -->
      <form action="#" method="post">
        <label for="user_name">الاسم:</label><br>
        <input type="text" id="user_name" name="user_name" required><br><br>

        <label for="user_email">الإيميل:</label><br>
        <input type="email" id="user_email" name="user_email" required><br><br>

        <label for="user_note">الرسالة:</label><br>
        <textarea id="user_note" name="user_note" rows="4" cols="30"></textarea><br><br>

        <button type="submit">إرسال</button>
      </form>
    </section>

  </main>

  <hr>

  <!-- الفوتر -->
  <footer>
    <p>حقوق النشر &copy; 2026</p>
  </footer>

</body>
</html>
